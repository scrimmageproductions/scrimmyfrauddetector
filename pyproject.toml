[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrimmy-fraud-detector"
dynamic = ["version"]
description = "Deterministic anomaly lead-generation for federal award recipients, producing evidence dossiers for human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3", "rapidfuzz>=3.6,<4", "networkx>=3.2,<4"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
litellm = ["litellm>=1.50"]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "streamlit>=1.50"]

[project.scripts]
scrimmy = "scrimmy.main:main"

[tool.setuptools]
packages = ["scrimmy"]

[tool.setuptools.dynamic]
version = { attr = "scrimmy.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
